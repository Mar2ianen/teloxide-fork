name: Apply Bot API 10.2 methods

on:
  pull_request:
    branches: [ next ]

permissions:
  contents: write

concurrency:
  group: apply-bot-api-10-2
  cancel-in-progress: true

env:
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: "--cfg CI_REDIS --cfg CI_POSTGRES"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bot-api-10.2-methods
          fetch-depth: 0

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - name: Restore implementation patch
        run: |
          base64 -d scripts/apply_bot_api_10_2.py.gz.b64 | gzip -d > /tmp/apply_bot_api_10_2.py
          python /tmp/apply_bot_api_10_2.py

      - name: Regenerate code
        shell: bash
        run: |
          generated=false
          for attempt in 1 2 3 4 5 6; do
            if cargo test -p teloxide-core --features "full nightly" codegen; then
              generated=true
              break
            fi
            echo "codegen pass ${attempt} changed files; rerunning"
          done
          test "$generated" = true

      - name: Format and verify generated tree
        run: |
          cargo fmt --all
          cargo test -p teloxide-core --features "full nightly" codegen

      - name: Run focused tests
        run: |
          cargo test -p teloxide-core --features "full nightly"
          cargo test -p teloxide --features "full nightly"

      - name: Remove temporary automation
        run: |
          rm -f BOT_API_10_2_WORK.md
          rm -f .github/workflows/export-worktree.yml
          rm -f .github/workflows/apply-bot-api-10-2.yml
          rm -f scripts/apply_bot_api_10_2.py.gz.b64
          rmdir scripts 2>/dev/null || true

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: support Telegram Bot API 10.2 methods"
          git push origin HEAD:bot-api-10.2-methods
