name: Apply Bot API 10.2 methods

on:
  pull_request:
    branches: [ next ]

permissions:
  contents: write

concurrency:
  group: apply-bot-api-10-2
  cancel-in-progress: true

env:
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: "--cfg CI_REDIS --cfg CI_POSTGRES"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bot-api-10.2-methods
          fetch-depth: 0

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - name: Restore implementation patch
        run: |
          cp crates/teloxide-core/src/bot/api.rs /tmp/bot-api-original.rs
          cp crates/teloxide-core/src/requests/multipart_payload.rs /tmp/multipart-original.rs
          base64 -d scripts/apply_bot_api_10_2.py.gz.b64 | gzip -d > /tmp/apply_bot_api_10_2.py
          python /tmp/apply_bot_api_10_2.py
          python - <<'PY'
          import json
          from pathlib import Path

          description = "A new rich message to replace the current message content"

          ron_path = Path("crates/teloxide-core/schema.ron")
          ron = ron_path.read_text()
          start = ron.index('names: ("editMessageTextInline"')
          end = ron.index('\n        Method(', start)
          block = ron[start:end]
          if 'name: "rich_message"' not in block:
              anchor = '''                Param(
                              name: "business_connection_id",'''
              rich = f'''                Param(
                              name: "rich_message",
                              ty: Option(RawTy("InputRichMessage")),
                              descr: Doc(md: "{description}"),
                          ),
          '''
              block = block.replace(anchor, rich + anchor, 1)
              ron = ron[:start] + block + ron[end:]
              ron_path.write_text(ron)

          json_path = Path("crates/teloxide-core/custom_v2.json")
          data = json.loads(json_path.read_text())
          method = next(m for m in data["methods"] if m["name"] == "editMessageTextInline")
          if not any(a["name"] == "rich_message" for a in method["arguments"]):
              index = next(i for i, a in enumerate(method["arguments"]) if a["name"] == "business_connection_id")
              method["arguments"].insert(index, {
                  "description": description,
                  "name": "rich_message",
                  "required": False,
                  "type_info": {"reference": "InputRichMessage", "type": "reference"},
              })
              json_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          cp crates/teloxide-core/src/bot/api.rs /tmp/bot-api-patched.rs
          cp crates/teloxide-core/src/requests/multipart_payload.rs /tmp/multipart-patched.rs
          cp /tmp/bot-api-original.rs crates/teloxide-core/src/bot/api.rs
          cp /tmp/multipart-original.rs crates/teloxide-core/src/requests/multipart_payload.rs

      - name: Bootstrap generated Requester API
        run: |
          cargo test -p teloxide-core --features "full nightly" codegen || true
          cp /tmp/bot-api-patched.rs crates/teloxide-core/src/bot/api.rs
          base64 -d scripts/patch_bot_api_10_2_adaptors.py.gz.b64 | gzip -d > /tmp/patch_bot_api_10_2_adaptors.py
          python /tmp/patch_bot_api_10_2_adaptors.py
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/teloxide-core/src/requests/requester.rs")
          text = path.read_text()
          start = text.index("macro_rules! forward_all")
          end = text.index("impl<B> Requester for &B", start)
          block = text[start:end]
          methods = [
              "answer_chat_join_request_query",
              "send_chat_join_request_web_app",
              "edit_ephemeral_message_text",
              "edit_ephemeral_message_media",
              "edit_ephemeral_message_caption",
              "edit_ephemeral_message_reply_markup",
              "delete_ephemeral_message",
              "send_rich_message",
              "send_rich_message_draft",
          ]
          missing = [method for method in methods if f"            {method}," not in block]
          if missing:
              anchor = "            approve_chat_join_request,\n            decline_chat_join_request\n            => $body, $ty"
              insertion = "".join(f"            {method},\n" for method in missing)
              if anchor not in block:
                  raise RuntimeError("blanket Requester forwarding anchor not found")
              block = block.replace(anchor, insertion + anchor, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text)
          PY

      - name: Regenerate code
        shell: bash
        run: |
          generated=false
          for attempt in 1 2 3 4 5 6; do
            if cargo test -p teloxide-core --features "full nightly" codegen; then
              generated=true
              break
            fi
            echo "codegen pass ${attempt} changed files; rerunning"
          done
          test "$generated" = true

      - name: Restore multipart integration test
        run: cp /tmp/multipart-patched.rs crates/teloxide-core/src/requests/multipart_payload.rs

      - name: Format and verify generated tree
        run: |
          cargo fmt --all
          cargo test -p teloxide-core --features "full nightly" codegen

      - name: Run focused tests
        run: |
          cargo test -p teloxide-core --features "full nightly"
          cargo test -p teloxide --features "full nightly"

      - name: Remove temporary automation
        run: |
          rm -f BOT_API_10_2_WORK.md
          rm -f .github/workflows/export-worktree.yml
          rm -f .github/workflows/apply-bot-api-10-2.yml
          rm -f scripts/apply_bot_api_10_2.py.gz.b64
          rm -f scripts/patch_bot_api_10_2_adaptors.py.gz.b64
          rmdir scripts 2>/dev/null || true

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: support Telegram Bot API 10.2 methods"
          git push origin HEAD:bot-api-10.2-methods
