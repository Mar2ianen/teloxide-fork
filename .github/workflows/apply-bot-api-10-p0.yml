name: Apply Bot API 10.0 P0 fixes

on:
  push:
    branches: [ master ]
    paths: [ .github/workflows/apply-bot-api-10-p0.yml ]
  pull_request:
    branches: [ master ]
    paths: [ .github/p0-trigger ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bot-api-10-p0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - name: Extract and run patch script
        shell: bash
        run: |
          python3 <<'PYEXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/bot-api-10-p0.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/apply_bot_api_10_p0.py').write_text(script + "\n")
          PYEXTRACT
          python3 /tmp/apply_bot_api_10_p0.py

      - name: Regenerate schema-derived code
        shell: bash
        run: |
          cargo test -p teloxide-core --features "full nightly" codegen -- --nocapture || true
          cargo test -p teloxide-core --features "full nightly" codegen -- --nocapture
          cargo fmt --all

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates README.md
          git commit -m "feat: complete Bot API 10.0 core method coverage"
          git push origin HEAD:fix/bot-api-10-p0
