name: Apply sendPoll multipart fix

on:
  push:
    branches: [ master ]
    paths: [ .github/workflows/apply-send-poll-multipart.yml ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/send-poll-multipart
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt,clippy

      - name: Apply fix
        run: python3 .github/scripts/fix_send_poll_multipart.py

      - name: Format
        run: cargo fmt --all

      - name: Check code generation twice
        run: |
          cargo test -p teloxide-core --features "full nightly" codegen -- --nocapture || true
          cargo test -p teloxide-core --features "full nightly" codegen -- --nocapture

      - name: Run multipart tests
        run: cargo test -p teloxide-core --features "full nightly" requests::multipart_payload::tests -- --nocapture

      - name: Commit result
        run: |
          rm .github/scripts/fix_send_poll_multipart.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: send poll media as multipart"
          git push origin HEAD:fix/send-poll-multipart
