name: Generate Bot API 10.0 P0 fixes

on:
  push:
    branches: [ fix/bot-api-10-p0 ]
    paths: [ .github/workflows/bot-api-10-p0.yml ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bot-api-10-p0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - name: Patch schema and handwritten types
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def ron_string(value: str) -> str:
              return value.replace('\\', '\\\\').replace('"', '\\"')

          def param(name: str, ty: str, description: str) -> str:
              return f'''                Param(
                              name: "{name}",
                              ty: {ty},
                              descr: Doc(md: "{ron_string(description)}"),
                          ),'''

          schema_path = Path("crates/teloxide-core/schema.ron")
          schema = schema_path.read_text()

          def method_bounds(text: str, api_name: str):
              marker = f'names: ("{api_name}",'
              marker_pos = text.index(marker)
              start = text.rfind("        Method(", 0, marker_pos)
              end = text.find("\n        Method(", marker_pos)
              if end == -1:
                  end = text.index("\n    ],", marker_pos)
              return start, end

          def param_span(block: str, name: str):
              marker_pos = block.index(f'name: "{name}"')
              start = block.rfind("                Param(", 0, marker_pos)
              end = block.find("\n                Param(", marker_pos)
              if end == -1:
                  end = block.index("\n            ],", marker_pos)
              return start, end

          def replace_param(block: str, name: str, replacement: str) -> str:
              start, end = param_span(block, name)
              return block[:start] + replacement.rstrip("\n") + block[end:]

          def insert_after_param(block: str, name: str, addition: str) -> str:
              _, end = param_span(block, name)
              return block[:end] + "\n" + addition.rstrip("\n") + block[end:]

          def update_method(api_name: str, transform):
              global schema
              start, end = method_bounds(schema, api_name)
              old = schema[start:end]
              new = transform(old)
              if new == old:
                  raise RuntimeError(f"method {api_name} was not changed")
              schema = schema[:start] + new + schema[end:]

          def update_send_poll(block: str) -> str:
              block = block.replace(
                  "A JSON-serialized list of 2-10 answer options",
                  "A JSON-serialized list of 1-12 answer options",
              )
              block = block.replace(
                  "True, if the poll allows multiple answers, ignored for polls in quiz mode, defaults to False",
                  "Pass True if the poll allows multiple answers, defaults to False",
              )

              if 'name: "correct_option_ids"' not in block:
                  poll_controls = "\n".join([
                      param("allows_revoting", "Option(bool)", "Pass True if the poll allows changing chosen answer options; defaults to False for quizzes and True for regular polls"),
                      param("shuffle_options", "Option(bool)", "Pass True if the poll options must be shown in random order"),
                      param("allow_adding_options", "Option(bool)", "Pass True if answer options can be added after creation; not supported for anonymous polls and quizzes"),
                      param("hide_results_until_closes", "Option(bool)", "Pass True if poll results must be shown only after the poll closes"),
                      param("members_only", "Option(bool)", "Pass True if voting is limited to users who have been members of the target chat for more than 24 hours; for channel chats only"),
                      param("country_codes", "Option(ArrayOf(String))", "A JSON-serialized list of 0-12 two-letter ISO 3166-1 alpha-2 country codes allowed to vote; use FT for anonymous numbers"),
                      param("correct_option_ids", "Option(ArrayOf(u8))", "A JSON-serialized list of monotonically increasing 0-based identifiers of correct answers, required for quiz polls"),
                  ])
                  block = replace_param(block, "correct_option_id", poll_controls)

              if 'name: "explanation_media"' not in block:
                  block = insert_after_param(
                      block,
                      "explanation_entities",
                      param("explanation_media", "Option(RawTy(\"InputPollMedia\"))", "Media added to the quiz explanation"),
                  )

              block = replace_param(
                  block,
                  "open_period",
                  param("open_period", "Option(u32)", "Amount of time in seconds the poll will be active after creation, 5-2628000. Can't be used together with close_date."),
              )
              block = replace_param(
                  block,
                  "close_date",
                  param("close_date", "Option(u64)", "Point in time when the poll will automatically close. Must be at least 5 and no more than 2628000 seconds in the future. Can't be used together with open_period."),
              )

              if 'name: "description_parse_mode"' not in block:
                  rich_poll = "\n".join([
                      param("description", "Option(String)", "Description of the poll to be sent, 0-1024 characters after entities parsing"),
                      param("description_parse_mode", "Option(RawTy(\"ParseMode\"))", "Mode for parsing entities in the poll description"),
                      param("description_entities", "Option(ArrayOf(RawTy(\"MessageEntity\")))", "A JSON-serialized list of special entities in the poll description, specified instead of description_parse_mode"),
                      param("media", "Option(RawTy(\"InputPollMedia\"))", "Media added to the poll description"),
                  ])
                  block = insert_after_param(block, "is_closed", rich_poll)
              return block

          update_method("sendPoll", update_send_poll)

          def add_optional_after(api_name: str, after: str, name: str, ty: str, description: str):
              def transform(block: str) -> str:
                  if f'name: "{name}"' in block:
                      raise RuntimeError(f"{api_name}.{name} already exists")
                  return insert_after_param(block, after, param(name, ty, description))
              update_method(api_name, transform)

          add_optional_after(
              "getChatAdministrators", "chat_id", "return_bots", "Option(bool)",
              "Pass True to additionally receive all bots that are administrators of the chat; other bots are omitted by default",
          )
          add_optional_after(
              "promoteChatMember", "can_manage_direct_messages", "can_manage_tags", "Option(bool)",
              "Pass True if the administrator can edit tags of regular members; for groups and supergroups only",
          )
          add_optional_after(
              "forwardMessage", "protect_content", "message_effect_id", "Option(RawTy(\"EffectId\"))",
              "Unique identifier of the message effect to add to the forwarded message; for private chats only",
          )
          add_optional_after(
              "copyMessage", "allow_paid_broadcast", "message_effect_id", "Option(RawTy(\"EffectId\"))",
              "Unique identifier of the message effect to add to the copied message; for private chats only",
          )

          schema_path.write_text(schema)

          poll_media_path = Path("crates/teloxide-core/src/types/poll_media.rs")
          poll_media = poll_media_path.read_text()
          old_poll_option_media = '''pub enum InputPollOptionMedia {
              Photo(crate::types::InputMediaPhoto),
              Sticker(crate::types::InputMediaSticker),
              Video(crate::types::InputMediaVideo),
          }'''
          new_poll_option_media = '''pub enum InputPollOptionMedia {
              Animation(crate::types::InputMediaAnimation),
              LivePhoto(crate::types::InputMediaLivePhoto),
              Location(crate::types::InputMediaLocation),
              Photo(crate::types::InputMediaPhoto),
              Sticker(crate::types::InputMediaSticker),
              Venue(crate::types::InputMediaVenue),
              Video(crate::types::InputMediaVideo),
          }'''
          if old_poll_option_media not in poll_media:
              raise RuntimeError("InputPollOptionMedia shape changed")
          poll_media_path.write_text(poll_media.replace(old_poll_option_media, new_poll_option_media))

          input_poll_option_path = Path("crates/teloxide-core/src/types/input_poll_option.rs")
          input_poll_option = input_poll_option_path.read_text()
          setter_anchor = '''    pub fn text_entities(self, text_entities: Vec<MessageEntity>) -> Self {
              Self { formatting: Some(InputPollOptionFormatting::TextEntities(text_entities)), ..self }
          }
          }'''
          setter_replacement = '''    pub fn text_entities(self, text_entities: Vec<MessageEntity>) -> Self {
              Self { formatting: Some(InputPollOptionFormatting::TextEntities(text_entities)), ..self }
          }

              pub fn media(mut self, media: InputPollOptionMedia) -> Self {
                  self.media = Some(media);
                  self
              }
          }'''
          if setter_anchor not in input_poll_option:
              raise RuntimeError("InputPollOption impl shape changed")
          input_poll_option_path.write_text(input_poll_option.replace(setter_anchor, setter_replacement))

          render_path = Path("crates/teloxide/src/utils/render.rs")
          render = render_path.read_text()
          render = render.replace(
              '''                        | MEK::CustomEmoji { .. }
                  )''',
              '''                        | MEK::CustomEmoji { .. }
                                      | MEK::DateTime { unix_time: Some(_), .. }
                  )''',
          )
          render = render.replace(
              '''                MEK::CustomEmoji { custom_emoji_id } => Kind::CustomEmoji(custom_emoji_id),
                          _ => continue,''',
              '''                MEK::CustomEmoji { custom_emoji_id } => Kind::CustomEmoji(custom_emoji_id),
                          MEK::DateTime { unix_time: Some(unix_time), date_time_format } => {
                              Kind::DateTime {
                                  unix_time: *unix_time,
                                  date_time_format: date_time_format.as_deref(),
                              }
                          }
                          _ => continue,''',
          )
          test_anchor = '''    #[test]
              fn test_render_nested() {'''
          date_time_test = '''    #[test]
              fn test_render_date_time() {
                  let text = "tomorrow";
                  let entities = vec![MessageEntity {
                      kind: MEK::DateTime {
                          unix_time: Some(1_647_531_900),
                          date_time_format: Some("wDT".to_owned()),
                      },
                      offset: 0,
                      length: 8,
                  }];

                  let render = Renderer::new(text, &entities);

                  assert_eq!(
                      render.as_html(),
                      "<tg-time unix=\"1647531900\" format=\"wDT\">tomorrow</tg-time>"
                  );
                  assert_eq!(
                      render.as_markdown(),
                      "![tomorrow](tg://time?unix=1647531900&format=wDT)"
                  );
              }

          '''
          if test_anchor not in render:
              raise RuntimeError("renderer test anchor changed")
          render_path.write_text(render.replace(test_anchor, date_time_test + test_anchor))

          tag_path = Path("crates/teloxide/src/utils/render/tag.rs")
          tag = tag_path.read_text()
          tag = tag.replace(
              '''    CustomEmoji(&'a CustomEmojiId),
          }''',
              '''    CustomEmoji(&'a CustomEmojiId),
              DateTime { unix_time: i64, date_time_format: Option<&'a str> },
          }''',
          )
          tag = tag.replace(
              '''    pub custom_emoji: ComplexTag,
              pub write_tag_fn:''',
              '''    pub custom_emoji: ComplexTag,
              pub date_time: ComplexTag,
              pub write_tag_fn:''',
          )
          tag = tag.replace(
              '''                Kind::CustomEmoji(custom_emoji_id) => match tag.place {
                              Place::Start => self.custom_emoji.start.len() + custom_emoji_id.0.len(),
                              Place::MidNewLine => unreachable!(),
                              Place::End => self.custom_emoji.middle.len() + self.custom_emoji.end.len(),
                          },
                      })''',
              '''                Kind::CustomEmoji(custom_emoji_id) => match tag.place {
                              Place::Start => self.custom_emoji.start.len() + custom_emoji_id.0.len(),
                              Place::MidNewLine => unreachable!(),
                              Place::End => self.custom_emoji.middle.len() + self.custom_emoji.end.len(),
                          },
                          Kind::DateTime { unix_time, date_time_format } => {
                              self.date_time.start.len()
                                  + self.date_time.middle.len()
                                  + self.date_time.end.len()
                                  + unix_time.to_string().len()
                                  + date_time_format.map_or(0, str::len)
                                  + 16
                          }
                      })''',
          )
          tag_path.write_text(tag)

          html_path = Path("crates/teloxide/src/utils/render/html.rs")
          html = html_path.read_text()
          html = html.replace(
              '''    custom_emoji: ComplexTag::new("<tg-emoji emoji-id=\\\"", "\\\">", "</tg-emoji>"),
              write_tag_fn:''',
              '''    custom_emoji: ComplexTag::new("<tg-emoji emoji-id=\\\"", "\\\">", "</tg-emoji>"),
              date_time: ComplexTag::new("<tg-time unix=\\\"", "\\\">", "</tg-time>"),
              write_tag_fn:''',
          )
          html = html.replace(
              '''        Kind::CustomEmoji(custom_emoji_id) => match tag.place {
                      Place::Start => write!(
                          buf,
                          "{}{}{}",
                          HTML.custom_emoji.start, custom_emoji_id, HTML.custom_emoji.middle
                      )
                      .unwrap(),
                      Place::MidNewLine => unreachable!(),
                      Place::End => buf.push_str(HTML.custom_emoji.end),
                  },
              }''',
              '''        Kind::CustomEmoji(custom_emoji_id) => match tag.place {
                      Place::Start => write!(
                          buf,
                          "{}{}{}",
                          HTML.custom_emoji.start, custom_emoji_id, HTML.custom_emoji.middle
                      )
                      .unwrap(),
                      Place::MidNewLine => unreachable!(),
                      Place::End => buf.push_str(HTML.custom_emoji.end),
                  },
                  Kind::DateTime { unix_time, date_time_format } => match tag.place {
                      Place::Start => {
                          write!(buf, "{}{}", HTML.date_time.start, unix_time).unwrap();
                          if let Some(format) = date_time_format {
                              write!(buf, "\\\" format=\\\"{format}").unwrap();
                          }
                          buf.push_str(HTML.date_time.middle);
                      }
                      Place::MidNewLine => unreachable!(),
                      Place::End => buf.push_str(HTML.date_time.end),
                  },
              }''',
          )
          html_path.write_text(html)

          markdown_path = Path("crates/teloxide/src/utils/render/markdown.rs")
          markdown = markdown_path.read_text()
          markdown = markdown.replace(
              '''    custom_emoji: ComplexTag::new("[", "](tg://emoji?id=", ")"),
              write_tag_fn:''',
              '''    custom_emoji: ComplexTag::new("[", "](tg://emoji?id=", ")"),
              date_time: ComplexTag::new("![", "](tg://time?unix=", ")"),
              write_tag_fn:''',
          )
          markdown = markdown.replace(
              '''        Kind::CustomEmoji(custom_emoji_id) => match tag.place {
                      Place::Start => buf.push_str(MARKDOWN.custom_emoji.start),
                      Place::MidNewLine => unreachable!(),
                      Place::End => write!(
                          buf,
                          "{}{}{}",
                          MARKDOWN.custom_emoji.middle, custom_emoji_id, MARKDOWN.custom_emoji.end
                      )
                      .unwrap(),
                  },
              }''',
              '''        Kind::CustomEmoji(custom_emoji_id) => match tag.place {
                      Place::Start => buf.push_str(MARKDOWN.custom_emoji.start),
                      Place::MidNewLine => unreachable!(),
                      Place::End => write!(
                          buf,
                          "{}{}{}",
                          MARKDOWN.custom_emoji.middle, custom_emoji_id, MARKDOWN.custom_emoji.end
                      )
                      .unwrap(),
                  },
                  Kind::DateTime { unix_time, date_time_format } => match tag.place {
                      Place::Start => buf.push_str(MARKDOWN.date_time.start),
                      Place::MidNewLine => unreachable!(),
                      Place::End => {
                          write!(buf, "{}{}", MARKDOWN.date_time.middle, unix_time).unwrap();
                          if let Some(format) = date_time_format {
                              write!(buf, "&format={format}").unwrap();
                          }
                          buf.push_str(MARKDOWN.date_time.end);
                      }
                  },
              }''',
          )
          markdown_path.write_text(markdown)

          for readme in [Path("README.md"), Path("crates/teloxide-core/README.md")]:
              contents = readme.read_text()
              contents = contents.replace(
                  "API%20coverage-Up%20to%2010.0%20(inclusively)-green.svg",
                  "API%20coverage-Bot%20API%2010.0%20core-yellowgreen.svg",
              )
              readme.write_text(contents)
          PY

      - name: Regenerate schema-derived code
        shell: bash
        run: |
          cargo test -p teloxide-core --features "full nightly" codegen -- --nocapture || true
          cargo test -p teloxide-core --features "full nightly" codegen -- --nocapture
          cargo fmt --all

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates README.md .github/workflows/bot-api-10-p0.yml
          git commit -m "feat: complete Bot API 10.0 core method coverage"
          git push origin HEAD:fix/bot-api-10-p0
