on:
  pull_request:
    branches: [next]

name: Apply type audit fixes

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  rust_nightly: nightly-2025-06-12

jobs:
  apply-type-audit:
    if: github.head_ref == 'fix/audit-type-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.rust_nightly }}
          components: rustfmt
      - name: Apply and validate fixes
        run: |
          python .github/apply_type_audit.py
          cargo +${{ env.rust_nightly }} fmt --all
          cargo +${{ env.rust_nightly }} test -p teloxide-core --features "full nightly" mentioned_users -- --nocapture
          cargo +${{ env.rust_nightly }} test -p teloxide-core --features "full nightly" managed_bot_request_id -- --nocapture
          cargo +${{ env.rust_nightly }} test -p teloxide --features "full nightly" --test bot_commands_alias -- --nocapture
          git diff --check
      - name: Commit type fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix audited type and update helpers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
