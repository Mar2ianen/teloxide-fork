on:
  pull_request:
    branches: [next]

name: Apply update offset fix

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  rust_nightly: nightly-2025-06-12

jobs:
  apply-update-offset:
    if: github.head_ref == 'fix/update-id-offset-overflow-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.rust_nightly }}
          components: rustfmt
      - name: Apply and validate fix
        run: |
          python .github/apply_update_offset_fix.py
          cargo +${{ env.rust_nightly }} fmt --all
          git diff --check
      - name: Commit update offset fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Prevent update offset overflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
