name: Preserve UpdateKind error payloads

on:
  pull_request:
    branches: [ ci/diagnose-robustness ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/robustness-panics-and-updates

      - name: Apply UpdateKind compatibility fix
        run: python .github/scripts/preserve_update_error_payload.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve malformed update payloads"
          git push origin HEAD:fix/robustness-panics-and-updates