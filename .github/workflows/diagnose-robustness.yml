name: Normalize MSRV and codegen fix

on:
  pull_request:
    branches: [ ci/diagnose-robustness ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/msrv-codegen-tooling

      - name: Normalize fixes
        run: python .github/scripts/normalize_codegen_fix.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit normalized fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: install pinned rustfmt for codegen tests"
          git push origin HEAD:fix/msrv-codegen-tooling