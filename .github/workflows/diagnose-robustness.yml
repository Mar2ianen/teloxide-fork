name: Apply MSRV and codegen fixes

on:
  pull_request:
    branches: [ ci/diagnose-robustness ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/msrv-codegen-tooling

      - name: Apply fixes
        run: |
          python .github/scripts/msrv_codegen_fixer.py
          git checkout -- .github/workflows/ci.yml
          rm .github/scripts/msrv_codegen_fixer.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: align MSRV and isolate codegen checks"
          git push origin HEAD:fix/msrv-codegen-tooling