name: Diagnose robustness PR

on:
  pull_request:
    branches: [ ci/diagnose-robustness ]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/robustness-panics-and-updates

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: beta

      - name: Capture concise failure log
        shell: bash
        run: |
          set +e
          cargo +beta test --tests --features full -- --nocapture > /tmp/test.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo
            grep -n -E "^(failures:|test result:|---- .* stdout ----)|panicked at|FAILED|error:" /tmp/test.log || true
            echo
            echo "--- tail ---"
            tail -n 250 /tmp/test.log
          } > .github/robustness-test-failure.log
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/robustness-test-failure.log
          git commit -m "ci: capture robustness test failure"
          git push origin HEAD:fix/robustness-panics-and-updates