name: Export worktree

on:
  push:
    branches: [ bot-api-10.2-methods ]
  pull_request:
    branches: [ next ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: teloxide-worktree
          path: |
            .
            !target
          include-hidden-files: true
          retention-days: 1
