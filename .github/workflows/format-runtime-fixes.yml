name: Format runtime fixes

on:
  push:
    branches: [ fix/runtime-media-and-live-period ]
    paths: [ .github/workflows/format-runtime-fixes.yml ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-media-and-live-period

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/teloxide-core/src/types/input_paid_media.rs \
                  crates/teloxide-core/src/types/live_period.rs \
                  crates/teloxide-core/src/serde_multipart/integration_tests.rs
          git commit -m "style: format runtime fixes"
          git push origin HEAD:fix/runtime-media-and-live-period
