# Temporary workflow; removed after the fixer runs.
name: Run robustness fixer

on:
  pull_request:
    branches: [ master ]
    paths: [ .github/trigger-robustness ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/robustness-panics-and-updates

      - name: Apply embedded fixer
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/apply-robustness-fixes.yml').read_text()
          block = workflow.split('      - name: Apply fixes\n', 1)[1]
          block = block.split('      - uses: dtolnay/rust-toolchain@master\n', 1)[0]
          script = block.split('        run: |\n', 1)[1]

          try:
              exec(textwrap.dedent(script), {'__name__': '__main__'})
          except SystemExit as error:
              if 'crates/teloxide-core/src/serde_multipart/error.rs' not in str(error):
                  raise

              path = Path('crates/teloxide-core/src/serde_multipart/error.rs')
              text = path.read_text()
              pattern = re.compile(
                  r'\n\s*// This should be ok.*?\n\s*e => unreachable!\(.*?\n\s*\),',
                  re.DOTALL,
              )
              replacement = '''
            error => RequestError::Io(Arc::new(std::io::Error::new(
                std::io::ErrorKind::InvalidData,
                error,
            ))),'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('multipart error fallback did not match')
              text += '''

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn internal_serialization_error_does_not_panic() {
        let error: RequestError = Error::TopLevelNotStruct.into();
        assert!(matches!(error, RequestError::Io(_)));
    }
}
'''
              path.write_text(text)

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-12
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/teloxide-core/src/types/chat_id.rs \
                  crates/teloxide-core/src/types/sticker.rs \
                  crates/teloxide-core/src/types/update.rs \
                  crates/teloxide-core/src/serde_multipart/unserializers/input_file.rs \
                  crates/teloxide-core/src/serde_multipart/unserializers.rs \
                  crates/teloxide-core/src/serde_multipart/error.rs
          git commit -m "fix: harden malformed Telegram data handling"
          git push origin HEAD:fix/robustness-panics-and-updates