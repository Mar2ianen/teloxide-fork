[package]
name = "teloxide-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
teloxide-core = { path = "../crates/teloxide-core", default-features = false }

[[bin]]
name = "updates"
path = "fuzz_targets/updates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bot_info_and_rich"
path = "fuzz_targets/bot_info_and_rich.rs"
test = false
doc = false
bench = false

[workspace]
